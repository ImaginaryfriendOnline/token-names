name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Verify tag matches module.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(node -p "require('./dist/module.json').version")
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match dist/module.json version $MODULE_VERSION"
            exit 1
          fi

      - name: Package module.zip
        run: |
          cd dist
          zip -r ../module.zip . -x "*.map"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            module.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
